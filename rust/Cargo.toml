[package]
name = "gridscape-backend-rust"
version = "0.1.0"
edition = "2021"

[dependencies]
axum = "0.8"
tokio = { version = "1", features = ["full"] }
reqwest = { version = "0.12", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
tower-http = { version = "0.6", features = ["fs"] }
parking_lot = "0.12"
dotenvy = "0.15"
